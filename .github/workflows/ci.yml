name: ci

on:
  push:
    branches: [main, stable, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GitHub's Windows runners have a signed-in desktop: drive Notepad through perch for real.
      - if: runner.os == 'Windows'
        run: node scripts/e2e-windows.mjs
